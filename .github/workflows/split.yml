name: Split all.json into house and senate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/all.json'

permissions:
  contents: write

# The publisher (votega.org: publish_ga_legislators.py members) writes all.json,
# members.csv, members.schema.json and ROSTER.md as FOUR separate Contents-API
# commits in quick succession. The push trigger fires on the first (all.json), so
# a second split run can be queued by a later publish. Serialize them rather than
# letting two runs race each other's push.
concurrency:
  group: split-all-json
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git pull --rebase` below always has a base to rebase
          # onto (a shallow checkout can make the rebase fail).
          fetch-depth: 0

      - name: Split all.json by chamber
        run: |
          python3 - <<'EOF'
          import json

          with open('data/all.json') as f:
              data = json.load(f)

          members = data.get('members', [])

          house  = [m for m in members if m.get('chamber') == 'House of Representatives']
          senate = [m for m in members if m.get('chamber') == 'Senate']

          def write(path, subset, source_meta):
              out = {
                  'metadata': {**source_meta, 'count': len(subset)},
                  'members': subset
              }
              with open(path, 'w') as f:
                  json.dump(out, f, indent=2, ensure_ascii=False)

          meta = data.get('metadata', {})
          write('data/house.json',  house,  meta)
          write('data/senate.json', senate, meta)
          print(f'House: {len(house)}  Senate: {len(senate)}')
          EOF

      - name: Commit split files
        run: |
          set -e
          git config user.name  "votega-bot"
          git config user.email "actions@github.com"
          git add data/house.json data/senate.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Split all.json → house.json + senate.json"
            # The publisher pushes up to four commits right after all.json, so the
            # ref moves under us between checkout and push. Rebase onto the latest
            # main and retry instead of failing the run on a non-fast-forward.
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Push failed after 5 attempts - house/senate split was NOT committed"
              exit 1
            fi
          fi
